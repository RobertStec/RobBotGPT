<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>RobBotGPT</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Inter, Arial, Helvetica, sans-serif;
            background: #212121;
            color: #ececec;
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        .sidebar {
            width: 270px;
            background: #171717;
            border-right: 1px solid #2f2f2f;
            display: flex;
            flex-direction: column;
            padding: 12px;
        }

        .brand {
            font-size: 18px;
            font-weight: 700;
            padding: 12px;
            margin-bottom: 10px;
        }

        .new-chat {
            border: 1px solid #3f3f3f;
            background: transparent;
            color: #ececec;
            padding: 12px;
            border-radius: 10px;
            text-align: left;
            cursor: pointer;
            font-size: 14px;
            margin-bottom: 16px;
        }

        .new-chat:hover {
            background: #2a2a2a;
        }

        .history-title {
            color: #999;
            font-size: 13px;
            margin: 10px 0;
            padding-left: 4px;
        }

        #conversationList {
            overflow-y: auto;
            flex: 1;
            padding-right: 4px;
        }

        .history-item {
            border-radius: 8px;
            color: #cfcfcf;
            font-size: 14px;
            cursor: pointer;
            margin-bottom: 4px;

            display: flex;
            align-items: center;
            gap: 6px;
        }

        .history-item-title {
            flex: 1;
            min-width: 0;
            padding: 10px 6px 10px 10px;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .delete-chat-btn {
            width: 32px;
            height: 32px;

            margin-right: 5px;

            border: none;
            border-radius: 7px;

            background: transparent;
            color: #aaa;

            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 15px;
        }

        .delete-chat-btn:hover {
            background: #454545;
            color: #ffffff;
        }

        .history-item:hover {
            background: #2a2a2a;
        }

        .history-item.active {
            background: #303030;
            color: #ffffff;
        }

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: #212121;
        }

        .topbar {
            height: 56px;
            border-bottom: 1px solid #2f2f2f;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            font-size: 16px;
            font-weight: 600;
        }

        .status {
            font-size: 13px;
            color: #aaa;
            font-weight: 400;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 30px 20px 150px;
        }

        .welcome {
            max-width: 760px;
            margin: 110px auto 0;
            text-align: center;
        }

        .welcome h1 {
            font-size: 34px;
            margin-bottom: 10px;
            font-weight: 650;
        }

        .welcome p {
            color: #aaa;
            font-size: 16px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            max-width: 760px;
            margin: 30px auto;
        }

        .card {
            border: 1px solid #3a3a3a;
            border-radius: 14px;
            padding: 16px;
            color: #ccc;
            cursor: pointer;
            text-align: left;
        }

        .card:hover {
            background: #2a2a2a;
        }

        .message {
            max-width: 820px;
            margin: 0 auto 28px;
            display: flex;
            gap: 12px;
            line-height: 1.65;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.assistant {
            justify-content: flex-start;
        }

        .message.user .avatar {
            order: 2;
        }

        .message.user .message-content {
            order: 1;
            background: #303030;
            border: 1px solid #3f3f3f;
            border-radius: 18px 18px 4px 18px;
            padding: 12px 16px;
            max-width: 70%;
        }

        .message.assistant .message-content {
            background: transparent;
            padding: 0;
            max-width: 75%;
        }

        .file-message {
            max-width: 820px;
            margin: 0 auto 20px;

            display: flex;
            justify-content: flex-end;
        }

        .file-card {
            display: flex;
            align-items: center;
            gap: 10px;

            max-width: 340px;

            background: #303030;
            border: 1px solid #444;
            border-radius: 14px;

            padding: 10px 12px;
        }

        .file-card-icon {
            width: 36px;
            height: 36px;

            flex-shrink: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #3a3a3a;
            border-radius: 8px;

            color: #ececec;
        }

        .file-card-info {
            min-width: 0;
        }

        .file-card-name {
            font-size: 14px;
            font-weight: 600;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .file-card-type {
            margin-top: 2px;

            font-size: 11px;
            color: #aaa;

            text-transform: uppercase;
        }

        .rag-sources {
            max-width: 820px;
            margin: -12px auto 28px;
            padding-left: 46px;
        }

        .rag-sources-title {
            color: #aaa;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .rag-source-item {
            display: inline-block;

            background: #2a2a2a;
            border: 1px solid #3f3f3f;
            border-radius: 9px;

            padding: 6px 9px;
            margin: 3px 5px 3px 0;

            color: #ccc;
            font-size: 12px;
        }

        .avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: bold;
        }

        .user-avatar {
            background: #5a4fcf;
        }

        .bot-avatar {
            background: #10a37f;
        }

        .message-content {
            color: #ececec;
            font-size: 16px;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .tool-progress {
            max-width: 820px;
            margin: 0 auto 14px;
            display: flex;
            justify-content: flex-start;
        }

        .tool-progress-box {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #2a2a2a;
            border: 1px solid #3f3f3f;
            color: #cfcfcf;
            padding: 8px 12px;
            border-radius: 12px;
            font-size: 13px;
        }

        .approval-btn {
            border: 1px solid #555;
            background: #303030;
            color: #ececec;
            padding: 7px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
        }

        .approval-btn:hover {
            background: #3d3d3d;
        }

        .approval-btn:disabled {
            opacity: 0.5;
            cursor: default;
        }

        .tool-spinner {
            width: 13px;
            height: 13px;
            border: 2px solid #555;
            border-top: 2px solid #10a37f;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .tool-check {
            color: #10a37f;
            font-weight: bold;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        .input-area {
            position: fixed;
            bottom: 0;
            left: 270px;
            right: 0;
            background: linear-gradient(to top, #212121 82%, transparent);
            padding: 24px 20px;
        }

        .input-wrapper {
            max-width: 820px;
            margin: 0 auto;
            background: #303030;
            border: 1px solid #444;
            border-radius: 18px;
            display: flex;
            align-items: flex-end;
            padding: 12px;
            box-shadow: 0 0 18px rgba(0, 0, 0, 0.25);
        }

        .attach-btn {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            border: none;
            background: transparent;
            color: #cfcfcf;
            cursor: pointer;
            font-size: 20px;
            margin-right: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .attach-btn:hover {
            background: #3a3a3a;
            color: #ffffff;
        }

        textarea {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            resize: none;
            color: #ececec;
            font-size: 16px;
            min-height: 30px;
            max-height: 170px;
            line-height: 1.5;
            padding: 7px;
        }

        textarea::placeholder {
            color: #aaa;
        }

        .model-select {
            height: 40px;
            max-width: 135px;
            background: #262626;
            color: #ececec;
            border: 1px solid #444;
            border-radius: 12px;
            padding: 0 8px;
            margin-left: 8px;
            outline: none;
            font-size: 13px;
            cursor: pointer;
            flex-shrink: 0;
        }

        .model-select:hover {
            background: #333333;
        }

        .model-select option {
            background: #262626;
            color: #ececec;
        }

        .language-select {
            height: 40px;
            width: 58px;

            background: #262626;
            color: #ececec;

            border: 1px solid #444;
            border-radius: 12px;

            padding: 0 8px;
            margin-left: 8px;

            outline: none;
            font-size: 13px;
            cursor: pointer;

            flex-shrink: 0;
        }

        .language-select:hover {
            background: #333333;
        }

        .language-select option {
            background: #262626;
            color: #ececec;
        }

        .mic-btn {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            border: none;
            background: transparent;
            color: #cfcfcf;
            cursor: pointer;
            font-size: 18px;
            margin-left: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .mic-btn:hover {
            background: #3a3a3a;
            color: #ffffff;
        }

        .mic-btn.recording {
            background: #ef4444;
            color: #ffffff;
            animation: pulseMic 1.2s infinite;
        }

        @keyframes pulseMic {
            0% {
                box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.5);
            }

            70% {
                box-shadow: 0 0 0 8px rgba(239, 68, 68, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(239, 68, 68, 0);
            }
        }

        .send-btn {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            border: none;
            background: #ececec;
            color: #111;
            cursor: pointer;
            font-size: 18px;
            margin-left: 8px;
            flex-shrink: 0;
        }

        .send-btn:hover {
            background: #ffffff;
        }

        .send-btn:disabled {
            background: #555;
            color: #999;
            cursor: not-allowed;
        }

        .notice {
            color: #aaa;
            font-size: 12px;
            max-width: 820px;
            margin: 8px auto 0;
            text-align: center;
        }

        @media (max-width: 768px) {
            .sidebar {
                display: none;
            }

            .input-area {
                left: 0;
            }

            .cards {
                grid-template-columns: 1fr;
            }

            .message.user .message-content,
            .message.assistant .message-content {
                max-width: 82%;
            }

            .model-select {
                max-width: 95px;
                font-size: 11px;
                padding: 0 6px;
            }

            .mic-btn {
                width: 36px;
                height: 36px;
                font-size: 16px;
                margin-left: 6px;
            }
        }
    </style>
</head>

<body>

<aside class="sidebar">
    <div class="brand">RobBotGPT</div>

    <button class="new-chat" onclick="newChat()">+ New chat</button>

    <div class="history-title">Recent Chats</div>
    <div id="conversationList"></div>
</aside>

<main class="main">
    <div class="topbar">
        <div>AI Chatbot</div>
        <div class="status" id="status">Ready</div>
    </div>

    <div class="chat-container" id="chatContainer">
        <div class="welcome" id="welcome">
            <h1>How can I help you today?</h1>
            <p>Ask questions, upload documents, use tools, search the web, and chat with memory.</p>
        </div>

        <div class="cards" id="cards">
            <div class="card" onclick="usePrompt('Search the web for latest AI agent news.')">
                Search latest web info
            </div>

            <div class="card" onclick="usePrompt('Summarize the document I uploaded.')">
                Summarize uploaded document
            </div>

            <div class="card" onclick="usePrompt('Remember that my channel name is dswithbappy.')">
                Save something to memory
            </div>

            <div class="card" onclick="usePrompt('Calculate 125 * 48 / 6')">
                Use calculator tool
            </div>
        </div>
    </div>

    <div class="input-area">
        <div class="input-wrapper">

            <input
                type="file"
                id="fileInput"
                style="display: none;"
                accept=".pdf,.docx,.txt,.md,.py,.csv"
                onchange="uploadFile()"
            >

            <button class="attach-btn" onclick="openFilePicker()" title="Upload document">
                📎
            </button>

            <textarea
                id="messageInput"
                placeholder="Ask anything..."
                rows="1"
                oninput="autoResize(this)"
                onkeydown="handleKeyDown(event)"
            ></textarea>

            <select id="modelSelect" class="model-select" title="Select model">
                <option value="gpt-4o-mini">gpt-4o-mini</option>
                <option value="gpt-4.1-mini">gpt-4.1-mini</option>
                <option value="gpt-5.6-luna">gpt-5.6-luna</option>
                <option value="gpt-5.6-terra">gpt-5.6-terra</option>
                <option value="gpt-5.6-sol">gpt-5.6-sol</option>
            </select>

            <select id="speechLanguageSelect" class="language-select" title="Speech language">
                <option value="pl-PL">PL</option>
                <option value="en-US">EN</option>
            </select>

            <button class="mic-btn" id="micBtn" onclick="toggleDictation()" title="Dictate">
                🎙️
            </button>

            <button class="send-btn" id="sendBtn" onclick="sendMessage()">➜</button>
        </div>

        <div class="notice" id="noticeText">
            RobBotGPT can make mistakes. Check important info.
        </div>
    </div>
</main>

<script>
    const chatContainer = document.getElementById("chatContainer");
    const messageInput = document.getElementById("messageInput");
    const sendBtn = document.getElementById("sendBtn");
    const statusText = document.getElementById("status");
    const conversationList = document.getElementById("conversationList");
    const modelSelect = document.getElementById("modelSelect");
    const speechLanguageSelect = document.getElementById("speechLanguageSelect");
    const noticeText = document.getElementById("noticeText");
    const micBtn = document.getElementById("micBtn");
    const toolProgressMap = new Map();

    let ragProgress = null;
    let waitingForApproval = false;
    let threadId = localStorage.getItem("thread_id");

    if (!threadId) {
        threadId = crypto.randomUUID();
        localStorage.setItem("thread_id", threadId);
    }

    const savedModel = localStorage.getItem("selected_model");

    if (savedModel && modelSelect) {
        modelSelect.value = savedModel;
    }

    if (modelSelect) {
        modelSelect.addEventListener("change", () => {
            localStorage.setItem("selected_model", modelSelect.value);

            if (noticeText) {
                noticeText.textContent = `Selected model: ${modelSelect.value}`;
            }
        });
    }

    let recognition = null;
    let isDictating = false;

    const savedSpeechLanguage =
        localStorage.getItem("speech_language");

    if (savedSpeechLanguage && speechLanguageSelect) {
        speechLanguageSelect.value =
            savedSpeechLanguage;
    }

    if (speechLanguageSelect) {
        speechLanguageSelect.addEventListener(
            "change",
            () => {

                localStorage.setItem(
                    "speech_language",
                    speechLanguageSelect.value
                );

                // If recognition already exists,
                // recreate it with the new language.
                if (recognition) {

                    if (isDictating) {
                        stopDictation();
                    }

                    recognition = null;
                }
            }
        );
    }

    function setupSpeechRecognition() {
        const SpeechRecognition =
            window.SpeechRecognition || window.webkitSpeechRecognition;

        if (!SpeechRecognition) {
            return null;
        }

        const speechRecognition = new SpeechRecognition();

        speechRecognition.lang =
            speechLanguageSelect
                ? speechLanguageSelect.value
                : "pl-PL";
        speechRecognition.continuous = true;
        speechRecognition.interimResults = true;

        speechRecognition.onstart = () => {
            isDictating = true;

            if (micBtn) {
                micBtn.classList.add("recording");
                micBtn.textContent = "⏹️";
            }

            statusText.textContent = "Listening...";
        };

        speechRecognition.onresult = (event) => {
            let finalTranscript = "";
            let interimTranscript = "";

            for (let i = event.resultIndex; i < event.results.length; i++) {
                const transcript = event.results[i][0].transcript;

                if (event.results[i].isFinal) {
                    finalTranscript += transcript + " ";
                } else {
                    interimTranscript += transcript;
                }
            }

            if (finalTranscript) {
                const currentText = messageInput.value.trim();

                messageInput.value = currentText
                    ? currentText + " " + finalTranscript.trim()
                    : finalTranscript.trim();

                autoResize(messageInput);
            }

            if (interimTranscript && noticeText) {
                noticeText.textContent = "Listening: " + interimTranscript;
            }
        };

        speechRecognition.onerror = (event) => {
            console.error("Speech recognition error:", event.error);

            if (event.error === "not-allowed") {
                alert("Microphone permission denied. Please allow microphone access.");
            }

            stopDictation();
        };

        speechRecognition.onend = () => {
            if (isDictating) {
                try {
                    speechRecognition.start();
                } catch (error) {
                    stopDictation();
                }
            }
        };

        return speechRecognition;
    }

    function toggleDictation() {
        if (!recognition) {
            recognition = setupSpeechRecognition();
        }

        if (!recognition) {
            alert("Speech recognition is not supported in this browser. Please use Chrome or Edge.");
            return;
        }

        if (isDictating) {
            stopDictation();
        } else {
            startDictation();
        }
    }

    function startDictation() {
        try {
            recognition.start();
        } catch (error) {
            console.error("Could not start dictation:", error);
        }
    }

    function stopDictation() {
        isDictating = false;

        if (recognition) {
            try {
                recognition.stop();
            } catch (error) {
                console.error("Could not stop dictation:", error);
            }
        }

        if (micBtn) {
            micBtn.classList.remove("recording");
            micBtn.textContent = "🎙️";
        }

        statusText.textContent = "Ready";

        if (noticeText) {
            noticeText.textContent = "RobBotGPT can make mistakes. Check important info.";
        }

        messageInput.focus();
    }

    function autoResize(textarea) {
        textarea.style.height = "auto";
        textarea.style.height = textarea.scrollHeight + "px";
    }

    function hideWelcome() {
        const welcome = document.getElementById("welcome");
        const cards = document.getElementById("cards");

        if (welcome) welcome.style.display = "none";
        if (cards) cards.style.display = "none";
    }

    function handleKeyDown(event) {
        if (event.key === "Enter" && !event.shiftKey) {
            event.preventDefault();
            sendMessage();
        }
    }

    function usePrompt(text) {
        messageInput.value = text;
        autoResize(messageInput);
        messageInput.focus();
    }

    function openFilePicker() {
        document.getElementById("fileInput").click();
    }

    function addMessage(role, content = "") {
        hideWelcome();

        const messageDiv = document.createElement("div");
        messageDiv.className = role === "user"
            ? "message user"
            : "message assistant";

        const avatar = document.createElement("div");
        avatar.className = role === "user"
            ? "avatar user-avatar"
            : "avatar bot-avatar";

        avatar.textContent = role === "user" ? "U" : "AI";

        const messageContent = document.createElement("div");
        messageContent.className = "message-content";
        messageContent.textContent = content;

        messageDiv.appendChild(avatar);
        messageDiv.appendChild(messageContent);

        chatContainer.appendChild(messageDiv);
        chatContainer.scrollTop = chatContainer.scrollHeight;

        return messageContent;
    }



    function addFileMessage(file) {
        hideWelcome();

        const wrapper = document.createElement("div");
        wrapper.className = "file-message";

        const card = document.createElement("div");
        card.className = "file-card";

        // -----------------------------------------
        // File icon
        // -----------------------------------------

        const icon = document.createElement("div");
        icon.className = "file-card-icon";

        icon.innerHTML = `
            <svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
            >
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
            </svg>
        `;

        // -----------------------------------------
        // File info
        // -----------------------------------------

        const info = document.createElement("div");
        info.className = "file-card-info";

        const name = document.createElement("div");
        name.className = "file-card-name";
        name.textContent = file.name;

        const type = document.createElement("div");
        type.className = "file-card-type";

        const extension =
            file.name.includes(".")
                ? file.name.split(".").pop()
                : "file";

        type.textContent = extension;

        info.appendChild(name);
        info.appendChild(type);

        card.appendChild(icon);
        card.appendChild(info);

        wrapper.appendChild(card);

        chatContainer.appendChild(wrapper);

        chatContainer.scrollTop =
            chatContainer.scrollHeight;
    }


    function addRagSources(sources) {

        if (!sources || !sources.length) {
            return;
        }

        const wrapper =
            document.createElement("div");

        wrapper.className =
            "rag-sources";

        const title =
            document.createElement("div");

        title.className =
            "rag-sources-title";

        title.textContent =
            "Sources";

        wrapper.appendChild(title);


        sources.forEach(source => {

            const item =
                document.createElement("div");

            item.className =
                "rag-source-item";

            let locationText = "";

            if (source.page) {

                locationText =
                    ` — strona ${source.page}`;

            } else if (source.chunk_index) {

                locationText =
                    ` — fragment ${source.chunk_index}`;
            }

            item.textContent =
                `📄 ${source.source}${locationText}`;

            wrapper.appendChild(item);
        });


        chatContainer.appendChild(
            wrapper
        );

        chatContainer.scrollTop =
            chatContainer.scrollHeight;
    }



    function addToolProgress(toolName) {
        const wrapper = document.createElement("div");
        wrapper.className = "tool-progress";

        const box = document.createElement("div");
        box.className = "tool-progress-box";

        const icon = document.createElement("span");
        icon.className = "tool-spinner";

        const text = document.createElement("span");
        text.textContent = `Using ${toolName}...`;

        box.appendChild(icon);
        box.appendChild(text);
        wrapper.appendChild(box);

        chatContainer.appendChild(wrapper);
        chatContainer.scrollTop = chatContainer.scrollHeight;

        return {
            wrapper,
            icon,
            text
        };
    }


    function completeToolProgress(toolProgress, toolName) {
        if (!toolProgress) return;

        toolProgress.icon.className = "tool-check";
        toolProgress.icon.textContent = "✓";
        toolProgress.text.textContent = `${toolName} completed`;
    }


    function formatToolName(toolName) {
        const names = {
            calculator: "Calculator",
            get_current_weather: "Current Weather",
            get_stock_price: "Stock Price",
            purchase_stock: "Purchase Stock",
            remember_this: "Memory Save",
            recall_memory: "Memory Recall",
            tavily_search: "Web Search"
        };

        return names[toolName] || toolName;
    }


    function addApprovalPrompt(payload) {
        const wrapper = document.createElement("div");
        wrapper.className = "tool-progress";

        const box = document.createElement("div");
        box.className = "tool-progress-box";

        box.style.flexDirection = "column";
        box.style.alignItems = "flex-start";

        const message = document.createElement("div");

        if (typeof payload === "string") {
            message.textContent = payload;
        } else {
            message.textContent =
                payload?.message || "Approval required.";
        }

        const actions = document.createElement("div");
        actions.style.display = "flex";
        actions.style.gap = "8px";
        actions.style.marginTop = "8px";


        const approveBtn = document.createElement("button");
        approveBtn.textContent = "Approve";
        approveBtn.className = "approval-btn";


        const declineBtn = document.createElement("button");
        declineBtn.textContent = "Decline";
        declineBtn.className = "approval-btn";


        approveBtn.onclick = () => {
            approveBtn.disabled = true;
            declineBtn.disabled = true;

            resumeInterruptedGraph(
                true,
                wrapper
            );
        };


        declineBtn.onclick = () => {
            approveBtn.disabled = true;
            declineBtn.disabled = true;

            resumeInterruptedGraph(
                false,
                wrapper
            );
        };


        actions.appendChild(approveBtn);
        actions.appendChild(declineBtn);

        box.appendChild(message);
        box.appendChild(actions);

        wrapper.appendChild(box);

        chatContainer.appendChild(wrapper);

        chatContainer.scrollTop =
            chatContainer.scrollHeight;
    }


    async function loadConversations() {
        try {
            const response = await fetch("/conversations");
            const data = await response.json();

            conversationList.innerHTML = "";

            if (!data.conversations || data.conversations.length === 0) {
                conversationList.innerHTML = `
                    <div class="history-item">No chats yet</div>
                `;
                return;
            }

            data.conversations.forEach(conv => {

                const item = document.createElement("div");
                item.className = "history-item";


                if (conv.thread_id === threadId) {
                    item.classList.add("active");
                }


                // -----------------------------------------
                // Conversation title
                // -----------------------------------------

                const title = document.createElement("span");

                title.className = "history-item-title";

                title.textContent =
                    conv.title || "New Chat";


                // -----------------------------------------
                // Delete button
                // -----------------------------------------

                const deleteBtn =
                    document.createElement("button");

                deleteBtn.className =
                    "delete-chat-btn";

                deleteBtn.textContent = "🗑️";

                deleteBtn.title =
                    "Delete conversation";

                deleteBtn.setAttribute(
                    "aria-label",
                    "Delete conversation"
                );


                // Open conversation
                item.onclick = () => {
                    loadConversation(conv.thread_id);
                };


                // Delete conversation
                deleteBtn.onclick = (event) => {

                    // Prevent opening conversation
                    // when clicking the trash icon
                    event.stopPropagation();

                    deleteConversation(
                        conv.thread_id
                    );
                };


                item.appendChild(title);
                item.appendChild(deleteBtn);

                conversationList.appendChild(item);
            });

        } catch (error) {
            console.error("Failed to load conversations:", error);
        }
    }


    async function deleteConversation(conversationThreadId) {

        const confirmed = window.confirm(
            "Czy na pewno chcesz usunąć tę konwersację?"
        );

        if (!confirmed) {
            return;
        }


        try {

            const response = await fetch(
                `/conversations/${encodeURIComponent(conversationThreadId)}`,
                {
                    method: "DELETE"
                }
            );


            const data = await response.json();


            if (!response.ok || !data.success) {

                throw new Error(
                    data.message ||
                    "Could not delete conversation."
                );
            }


            // -----------------------------------------
            // If currently opened conversation
            // was deleted -> create a new empty chat
            // -----------------------------------------

            if (conversationThreadId === threadId) {

                threadId = crypto.randomUUID();

                localStorage.setItem(
                    "thread_id",
                    threadId
                );

                renderWelcome();
            }


            // Refresh sidebar
            await loadConversations();


        } catch (error) {

            console.error(
                "Failed to delete conversation:",
                error
            );

            alert(
                "Nie udało się usunąć konwersacji."
            );
        }
    }



    async function loadConversation(selectedThreadId) {
        threadId = selectedThreadId;
        localStorage.setItem("thread_id", threadId);

        try {
            const response = await fetch(`/history/${threadId}`);
            const data = await response.json();

            chatContainer.innerHTML = "";

            if (!data.messages || data.messages.length === 0) {
                renderWelcome();
                await loadConversations();
                return;
            }

            data.messages.forEach(msg => {

                addMessage(
                    msg.role === "user"
                        ? "user"
                        : "assistant",
                    msg.content
                );

                if (
                    msg.role === "assistant" &&
                    msg.sources &&
                    msg.sources.length > 0
                ) {
                    addRagSources(
                        msg.sources
                    );
                }
            });

            await loadConversations();

        } catch (error) {
            console.error("Failed to load conversation:", error);
        }
    }

    function renderWelcome() {
        chatContainer.innerHTML = `
            <div class="welcome" id="welcome">
                <h1>How can I help you today?</h1>
                <p>Ask questions, upload documents, use tools, search the web, and chat with memory.</p>
            </div>

            <div class="cards" id="cards">
                <div class="card" onclick="usePrompt('Search the web for latest AI agent news.')">
                    Search latest web info
                </div>

                <div class="card" onclick="usePrompt('Summarize the document I uploaded.')">
                    Summarize uploaded document
                </div>

                <div class="card" onclick="usePrompt('Remember that my channel name is dswithbappy.')">
                    Save something to memory
                </div>

                <div class="card" onclick="usePrompt('Calculate 125 * 48 / 6')">
                    Use calculator tool
                </div>
            </div>
        `;
    }

    function parseSSEPart(part) {
        const lines = part
            .split(/\r?\n/)
            .filter(line => line.trim().startsWith("data:"));

        if (lines.length === 0) {
            return null;
        }

        const jsonText = lines
            .map(line => line.replace(/^data:\s*/, ""))
            .join("\n")
            .trim();

        if (!jsonText || jsonText === "[DONE]") {
            return null;
        }

        try {
            return JSON.parse(jsonText);
        } catch (error) {
            console.error("Invalid stream JSON:", jsonText, error);
            return null;
        }
    }

    function handleStreamData(
            data,
            botElement,
            selectedModel
        ) {
            if (!data) return;

            // -----------------------------------------
            // RAG SEARCH START
            // -----------------------------------------

            if (data.type === "rag_search_start") {

                ragProgress =
                    addToolProgress("Document Search");

                statusText.textContent =
                    "Searching documents...";

                return;
            }

            // -----------------------------------------
            // RAG SEARCH END
            // -----------------------------------------

            if (data.type === "rag_search_end") {

                if (ragProgress) {

                    completeToolProgress(
                        ragProgress,
                        "Document Search"
                    );

                    ragProgress = null;
                }

                statusText.textContent =
                    "Document Search completed";

                return;
            }

            if (data.type === "rag_sources") {

                addRagSources(
                    data.sources
                );

                return;
            }

            // -----------------------------------------
            // TOOL START
            // -----------------------------------------
            if (data.type === "tool_start") {
                const toolName = formatToolName(data.tool);

                const progress = addToolProgress(toolName);

                const key =
                    data.tool_call_id || data.tool;

                toolProgressMap.set(
                    key,
                    progress
                );

                statusText.textContent =
                    `Using ${toolName}...`;

                return;
            }

            // -----------------------------------------
            // TOOL END
            // -----------------------------------------
            if (data.type === "tool_end") {
                const toolName = formatToolName(data.tool);

                const key =
                    data.tool_call_id || data.tool;

                const progress =
                    toolProgressMap.get(key);

                if (progress) {
                    completeToolProgress(
                        progress,
                        toolName
                    );

                    toolProgressMap.delete(key);
                }

                statusText.textContent =
                    `${toolName} completed`;

                return;
            }

            // -----------------------------------------
            // HUMAN-IN-THE-LOOP INTERRUPT
            // -----------------------------------------
            if (data.type === "interrupt") {
                waitingForApproval = true;

                addApprovalPrompt(data.payload);

                statusText.textContent =
                    "Waiting for approval...";

                return;
            }


            // -----------------------------------------
            // TOKEN
            // -----------------------------------------
            if (
                data.type === "token" &&
                data.token !== undefined &&
                data.token !== null
            ) {
                botElement.textContent += data.token;

                statusText.textContent =
                    `Generating with ${selectedModel}...`;

                chatContainer.scrollTop =
                    chatContainer.scrollHeight;

                return;
            }

            // -----------------------------------------
            // ERROR
            // -----------------------------------------
            if (data.type === "error" || data.error) {
                botElement.textContent +=
                    "\n\nError: " + data.error;

                statusText.textContent = "Ready";

                return;
            }

            // -----------------------------------------
            // DONE
            // -----------------------------------------
            if (data.type === "done" || data.done) {
                statusText.textContent = "Ready";
            }
        }

    async function resumeInterruptedGraph(
        approved,
        approvalElement
    ) {
        waitingForApproval = false;

        const selectedModel =
            modelSelect
                ? modelSelect.value
                : "gpt-4o-mini";

        statusText.textContent =
            approved
                ? "Purchase approved..."
                : "Purchase declined...";


        const botElement =
            addMessage("assistant", "");


        try {
            const response = await fetch(
                "/chat/stream",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        thread_id: threadId,
                        model: selectedModel,
                        resume: approved
                    })
                }
            );


            if (!response.ok) {
                botElement.textContent =
                    "Could not resume agent.";

                return;
            }


            if (approvalElement) {
                const buttons =
                    approvalElement.querySelectorAll("button");

                buttons.forEach(
                    button => button.disabled = true
                );
            }


            const reader =
                response.body.getReader();

            const decoder =
                new TextDecoder("utf-8");

            let buffer = "";


            while (true) {
                const { value, done } =
                    await reader.read();

                if (done) {
                    break;
                }

                buffer += decoder.decode(
                    value,
                    { stream: true }
                );

                const parts =
                    buffer.split(/\r?\n\r?\n/);

                buffer =
                    parts.pop() || "";


                for (const part of parts) {
                    const data =
                        parseSSEPart(part);

                    handleStreamData(
                        data,
                        botElement,
                        selectedModel
                    );
                }
            }


            buffer += decoder.decode();


            if (buffer.trim()) {
                const data =
                    parseSSEPart(buffer);

                handleStreamData(
                    data,
                    botElement,
                    selectedModel
                );
            }

        } catch (error) {

            console.error(
                "Resume error:",
                error
            );

            botElement.textContent =
                "Could not resume agent: " +
                error.message;

        } finally {

            statusText.textContent = "Ready";
        }
    }    


    async function sendMessage() {
        const message = messageInput.value.trim();

        if (!message) return;

        if (isDictating) {
            stopDictation();
        }

        const selectedModel = modelSelect ? modelSelect.value : "gpt-4o-mini";

        addMessage("user", message);

        messageInput.value = "";
        messageInput.style.height = "auto";

        sendBtn.disabled = true;
        statusText.textContent = `Thinking with ${selectedModel}...`;

        toolProgressMap.clear();

        const botElement = addMessage("assistant", "");

        

        try {
            const response = await fetch("/chat/stream", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    message: message,
                    thread_id: threadId,
                    model: selectedModel,
                    speech_language:
                        speechLanguageSelect
                            ? speechLanguageSelect.value
                            : "pl-PL"
                })
            });

            if (!response.ok) {
                let errorText = "Request failed.";

                try {
                    const errorData = await response.json();
                    errorText = errorData.detail || errorData.message || errorText;
                } catch (error) {
                    console.error("Could not parse error response:", error);
                }

                botElement.textContent = errorText;
                return;
            }

            if (!response.body) {
                botElement.textContent = "Streaming is not supported by this browser.";
                return;
            }

            const reader = response.body.getReader();
            const decoder = new TextDecoder("utf-8");

            let buffer = "";

            while (true) {
                const { value, done } = await reader.read();

                if (done) {
                    break;
                }

                buffer += decoder.decode(value, { stream: true });

                const parts = buffer.split(/\r?\n\r?\n/);
                buffer = parts.pop() || "";

                for (const part of parts) {
                    const data = parseSSEPart(part);
                    handleStreamData(
                        data,
                        botElement,
                        selectedModel
                    );
                }
            }

            /*
                Important fix:
                Sometimes the final streamed response does not end with "\n\n".
                In that case, the final data remains inside buffer.
                This part makes sure the leftover buffer is also displayed.
            */
            buffer += decoder.decode();

            if (buffer.trim()) {
                const data = parseSSEPart(buffer);
                handleStreamData(
                    data,
                    botElement,
                    selectedModel
                );
            }

        } catch (error) {
            console.error("Streaming error:", error);

            botElement.textContent = "Something went wrong: " + error.message;

        } finally {
            sendBtn.disabled = false;
        
            if (!waitingForApproval) {
                statusText.textContent = "Ready";
            }

            messageInput.focus();

            await loadConversations();
        }
    }

    async function uploadFile() {
        const fileInput = document.getElementById("fileInput");

        if (!fileInput.files.length) {
            return;
        }

        const file = fileInput.files[0];

        addFileMessage(file);

        const toolProgress = addToolProgress("Document Ingestion");
        statusText.textContent = "Using Document Ingestion...";

        const formData = new FormData();
        formData.append("file", file);
        formData.append("thread_id", threadId);

        try {
            const response = await fetch("/upload", {
                method: "POST",
                body: formData
            });

            const data = await response.json();

            completeToolProgress(toolProgress, "Document Ingestion");

            if (data.success) {

                await loadConversations();

            } else {

                addMessage(
                    "assistant",
                    "Upload failed: " + data.message
                );
            }

        } catch (error) {
            completeToolProgress(toolProgress, "Document Ingestion");
            addMessage("assistant", "Upload failed: " + error.message);
        }

        statusText.textContent = "Ready";
        fileInput.value = "";
    }

    async function newChat() {
        threadId = crypto.randomUUID();
        localStorage.setItem("thread_id", threadId);

        if (isDictating) {
            stopDictation();
        }

        renderWelcome();
        await loadConversations();
        messageInput.focus();
    }

    loadConversations();

    if (threadId) {
        loadConversation(threadId);
    }
</script>
