services:
  db:
    image: pgvector/pgvector:pg16

    container_name: robbotgpt-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: robbotgpt
      POSTGRES_USER: robbotgpt
      POSTGRES_PASSWORD: robbotgpt_dev

    ports:
      - "5433:5432"

    volumes:
      - robbotgpt_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U robbotgpt -d robbotgpt"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


volumes:
  robbotgpt_postgres_data: