services:
  db:
    image: pgvector/pgvector:pg16

    container_name: robbotgpt-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: robbotgpt
      POSTGRES_USER: robbotgpt
      POSTGRES_PASSWORD: robbotgpt_dev

    ports:
      - "5433:5432"

    volumes:
      - robbotgpt_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U robbotgpt -d robbotgpt"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile

    image: robbotgpt:local

    container_name: robbotgpt-app

    restart: unless-stopped

    init: true
    read_only: true

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    tmpfs:
      - /tmp:size=64m,mode=1777

    env_file:
      - .env

    environment:
      APP_ENV: production
      APP_HOST: 0.0.0.0
      APP_PORT: 8080
      APP_RELOAD: "false"
      DATABASE_URL: postgresql+psycopg://robbotgpt:robbotgpt_dev@db:5432/robbotgpt

    ports:
      - "8080:8080"

    volumes:
      - ./uploads:/app/uploads
      - ./data:/app/data

    depends_on:
      db:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=5)"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  robbotgpt_postgres_data:
