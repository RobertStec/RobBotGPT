name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    name: Python tests
    runs-on: ubuntu-latest

    timeout-minutes: 15

    env:
      APP_ENV: test
      APP_RELOAD: "false"

      DATABASE_URL: sqlite:///./data/ci_test.db

      OPENAI_API_KEY: test-openai-key
      TAVILY_API_KEY: test-tavily-key

      LANGSMITH_TRACING: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Check dependencies
        run: pip check

      - name: Create runtime directories
        run: mkdir -p data uploads

      - name: Run tests
        run: python -m pytest -q

  postgres-tests:
    name: PostgreSQL integration tests
    runs-on: ubuntu-latest

    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:pg16

        env:
          POSTGRES_DB: robbotgpt_test
          POSTGRES_USER: robbotgpt
          POSTGRES_PASSWORD: robbotgpt_test

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U robbotgpt -d robbotgpt_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: test
      APP_RELOAD: "false"

      DATABASE_URL: postgresql+psycopg://robbotgpt:robbotgpt_test@localhost:5432/robbotgpt_test
      TEST_DATABASE_URL: postgresql+psycopg://robbotgpt:robbotgpt_test@localhost:5432/robbotgpt_test

      OPENAI_API_KEY: test-openai-key
      TAVILY_API_KEY: test-tavily-key

      LANGSMITH_TRACING: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Enable pgvector
        run: |
          python - <<'PY'
          import psycopg

          with psycopg.connect(
              "postgresql://robbotgpt:robbotgpt_test@localhost:5432/robbotgpt_test"
          ) as connection:
              connection.execute(
                  "CREATE EXTENSION IF NOT EXISTS vector"
              )

          print("pgvector enabled")
          PY

      - name: Run Alembic migrations
        run: alembic upgrade head

      - name: Run PostgreSQL integration tests
        run: |
          python -m pytest \
            tests/integration/test_postgres_database.py \
            tests/integration/test_postgres_api.py \
            tests/integration/test_postgres_checkpoints.py \
            -v