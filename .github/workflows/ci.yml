name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    name: Python tests
    runs-on: ubuntu-latest

    timeout-minutes: 15

    env:
      APP_ENV: test
      APP_RELOAD: "false"

      DATABASE_URL: sqlite:///./data/ci_test.db

      OPENAI_API_KEY: test-openai-key
      TAVILY_API_KEY: test-tavily-key

      LANGSMITH_TRACING: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Check dependencies
        run: pip check

      - name: Create runtime directories
        run: mkdir -p data uploads

      - name: Run tests with coverage gate
        run: |
          python -m pytest \
            --cov=app \
            --cov=agent \
            --cov=nodes \
            --cov=rag \
            --cov=reranker \
            --cov=database \
            --cov=checkpoints \
            --cov=tools \
            --cov=core \
            --cov-report=term-missing \
            --cov-report=xml \
            -q

  postgres-tests:
    name: PostgreSQL integration tests
    runs-on: ubuntu-latest

    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:pg16

        env:
          POSTGRES_DB: robbotgpt_test
          POSTGRES_USER: robbotgpt
          POSTGRES_PASSWORD: robbotgpt_test

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U robbotgpt -d robbotgpt_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: test
      APP_RELOAD: "false"

      DATABASE_URL: postgresql+psycopg://robbotgpt:robbotgpt_test@localhost:5432/robbotgpt_test
      TEST_DATABASE_URL: postgresql+psycopg://robbotgpt:robbotgpt_test@localhost:5432/robbotgpt_test

      OPENAI_API_KEY: test-openai-key
      TAVILY_API_KEY: test-tavily-key

      LANGSMITH_TRACING: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Enable pgvector
        run: |
          python - <<'PY'
          import psycopg

          with psycopg.connect(
              "postgresql://robbotgpt:robbotgpt_test@localhost:5432/robbotgpt_test"
          ) as connection:
              connection.execute(
                  "CREATE EXTENSION IF NOT EXISTS vector"
              )

          print("pgvector enabled")
          PY

      - name: Run Alembic migrations
        run: alembic upgrade head

      - name: Run PostgreSQL integration tests
        run: |
          python -m pytest \
            tests/integration/test_postgres_database.py \
            tests/integration/test_postgres_api.py \
            tests/integration/test_postgres_checkpoints.py \
            -v

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest

    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build production Docker image
        run: docker build -t robbotgpt:ci .

      - name: Verify Docker image
        run: docker image inspect robbotgpt:ci > /dev/null

      - name: Verify Python runtime
        run: |
          docker run --rm \
            --entrypoint python \
            robbotgpt:ci \
            --version

      - name: Verify non-root user
        run: |
          docker run --rm \
            --entrypoint sh \
            robbotgpt:ci \
            -c 'test "$(whoami)" = "robbotgpt"'

      - name: Scan Docker image with Trivy
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            ghcr.io/aquasecurity/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c \
            image \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --skip-files '**/pip/_vendor/bom.cdx.json' \
            --exit-code 1 \
            robbotgpt:ci

  security-audit:
    name: Dependency security audit
    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install audit tooling
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Audit production dependencies
        run: python -m pip_audit -r requirements.txt

  static-security-analysis:
    name: Python static security analysis
    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install Bandit
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      - name: Run Bandit security scan
        run: |
          bandit \
            -r . \
            -x ./tests,./alembic \
            -ll \
            -ii

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}