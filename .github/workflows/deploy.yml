name: Deploy to AWS

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: robbotgpt-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Verify AWS deployment channel
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: RobBotGPTDeploy

      - name: Verify assumed AWS identity
        run: aws sts get-caller-identity

      - name: Run SSM deployment smoke test
        id: ssm
        shell: bash
        run: |
          set -euo pipefail

          PARAMETERS=$(jq -n \
            --arg deploy_path "${{ vars.AWS_DEPLOY_PATH }}" \
            '{
              commands: [
                "set -eu",
                ("cd " + $deploy_path),
                "echo OIDC_and_SSM_OK",
                "docker compose --env-file .env.production -f docker-compose.prod.yml ps"
              ]
            }')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.AWS_EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "RobBotGPT deployment smoke test" \
            --parameters "$PARAMETERS" \
            --query "Command.CommandId" \
            --output text)

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "SSM command ID: $COMMAND_ID"

      - name: Wait for SSM command
        run: |
          aws ssm wait command-executed \
            --command-id "${{ steps.ssm.outputs.command_id }}" \
            --instance-id "${{ vars.AWS_EC2_INSTANCE_ID }}"

      - name: Show SSM command result
        run: |
          aws ssm get-command-invocation \
            --command-id "${{ steps.ssm.outputs.command_id }}" \
            --instance-id "${{ vars.AWS_EC2_INSTANCE_ID }}" \
            --query '{Status:Status,ResponseCode:ResponseCode,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output yaml