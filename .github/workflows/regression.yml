name: Regression Quality Gate

on:
  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: Regression quality gate
    runs-on: ubuntu-latest

    timeout-minutes: 20

    services:
      postgres:
        image: pgvector/pgvector:pg16

        env:
          POSTGRES_DB: robbotgpt_regression
          POSTGRES_USER: robbotgpt
          POSTGRES_PASSWORD: robbotgpt_regression

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U robbotgpt -d robbotgpt_regression"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: test
      APP_RELOAD: "false"

      DATABASE_URL: postgresql+psycopg://robbotgpt:robbotgpt_regression@localhost:5432/robbotgpt_regression
      TEST_DATABASE_URL: postgresql+psycopg://robbotgpt:robbotgpt_regression@localhost:5432/robbotgpt_regression

      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
      EMBEDDING_MODEL: ${{ vars.EMBEDDING_MODEL }}

      LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
      LANGSMITH_ENDPOINT: ${{ vars.LANGSMITH_ENDPOINT }}
      LANGSMITH_PROJECT: ${{ vars.LANGSMITH_PROJECT }}
      LANGSMITH_WORKSPACE_ID: ${{ vars.LANGSMITH_WORKSPACE_ID }}
      LANGSMITH_TRACING: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Enable pgvector
        run: |
          python - <<'PY'
          import psycopg

          with psycopg.connect(
              "postgresql://robbotgpt:robbotgpt_regression@localhost:5432/robbotgpt_regression"
          ) as connection:
              connection.execute(
                  "CREATE EXTENSION IF NOT EXISTS vector"
              )

          print("pgvector enabled")
          PY

      - name: Run database migrations
        run: alembic upgrade head

      - name: Validate LangSmith connection
        run: |
          python - <<'PY'
          from evals.langsmith_client import get_langsmith_client

          client = get_langsmith_client()
          next(iter(client.list_datasets(limit=1)), None)

          print("LangSmith connection OK")
          PY

      - name: Seed regression RAG corpus
        run: python -m evals.seed_corpus

      - name: Run regression quality gate
        run: python -m evals.run_experiment
